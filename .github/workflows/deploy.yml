name: Backend CI-CD Pipeline

on:
  push:
    branches: [main, develop, quang-duc]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  IMAGE_NAME: foodsaver-backend
  REPO_URL: https://github.com/Ducdz2k4/FoodSaver-BE.git
  DEPLOY_DIR: /opt/foodsaver-be

jobs:
  lint-and-validate:
    name: Lint & Prisma Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate Prisma Schema
        env:
          DATABASE_URL: "mysql://mock_user:mock_pass@localhost:3306/mock_db"
        run: npx prisma validate --schema=prisma/schema

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "mysql://mock_user:mock_pass@localhost:3306/mock_db"
        run: npx prisma generate --schema=prisma/schema

  build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    needs: lint-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

  deploy:
    name: Blue-Green Deploy to VPS
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Blue-Green Deploy via SSH & PM2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
          # Database & Server Config
          PORT: ${{ secrets.PORT || '5000' }}
          NODE_ENV: production
          API_PREFIX: /api/v1
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN || '*' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # JWT Secrets
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || '7d' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN || '30d' }}
          # Cloudinary Media Storage
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # AI Services (TypeSafe JEV & Groq)
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_API_URL: ${{ secrets.JEV_API_URL || 'https://api.typesafe.ai/v1/systemone' }}
          JEV_MODEL: ${{ secrets.JEV_MODEL || 'jev-latest' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          GROQ_API_URL: ${{ secrets.GROQ_API_URL || 'https://api.groq.com/openai/v1' }}
          # SMTP Email
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Google OAuth
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error ::SSH_PRIVATE_KEY secret is not configured in GitHub Secrets!"
            exit 1
          fi
          if [ -z "$SERVER_HOST" ]; then
            echo "::error ::SERVER_HOST secret is not configured in GitHub Secrets!"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "📡 Testing network connectivity to $SERVER_HOST:$SERVER_PORT..."
          nc -z -v -w 5 "$SERVER_HOST" "$SERVER_PORT" 2>&1 || true

          echo "🚀 Initiating Blue-Green Zero-Downtime Deployment for Backend via SSH..."
          ssh -i ~/.ssh/id_rsa \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$SERVER_USER@$SERVER_HOST" \
            "env PORT='$PORT' NODE_ENV='$NODE_ENV' API_PREFIX='$API_PREFIX' PAYMENT_WEBHOOK_SECRET='$PAYMENT_WEBHOOK_SECRET' CORS_ORIGIN='$CORS_ORIGIN' DATABASE_URL='$DATABASE_URL' JWT_SECRET='$JWT_SECRET' JWT_EXPIRES_IN='$JWT_EXPIRES_IN' JWT_REFRESH_SECRET='$JWT_REFRESH_SECRET' JWT_REFRESH_EXPIRES_IN='$JWT_REFRESH_EXPIRES_IN' CLOUDINARY_CLOUD_NAME='$CLOUDINARY_CLOUD_NAME' CLOUDINARY_API_KEY='$CLOUDINARY_API_KEY' CLOUDINARY_API_SECRET='$CLOUDINARY_API_SECRET' JEV_API_KEY='$JEV_API_KEY' JEV_API_URL='$JEV_API_URL' JEV_MODEL='$JEV_MODEL' GROQ_API_KEY='$GROQ_API_KEY' GROQ_MODEL='$GROQ_MODEL' GROQ_API_URL='$GROQ_API_URL' SMTP_HOST='$SMTP_HOST' SMTP_PORT='$SMTP_PORT' SMTP_USER='$SMTP_USER' SMTP_PASS='$SMTP_PASS' GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' REPO_URL='${{ env.REPO_URL }}' COMMIT_SHA='${{ github.sha }}' bash -s" << 'REMOTE_DEPLOY_EOF'
          set -e

          APP_DIR="/opt/foodsaver-be"
          RELEASES_DIR="$APP_DIR/releases"
          SHARED_DIR="$APP_DIR/shared"
          CURRENT_LINK="$APP_DIR/current"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          NEW_RELEASE_DIR="$RELEASES_DIR/$TIMESTAMP"

          echo "=========================================================="
          echo "🚀 [BLUE-GREEN DEPLOY] FoodSaver Backend API"
          echo "Target Release : $TIMESTAMP"
          echo "Git Commit     : ${COMMIT_SHA:-HEAD}"
          echo "=========================================================="

          # 1. Setup base directory structure
          mkdir -p "$RELEASES_DIR" "$SHARED_DIR"

          # 2. Identify currently active release (Blue slot) for instant rollback
          PREV_RELEASE=""
          if [ -L "$CURRENT_LINK" ]; then
            PREV_RELEASE=$(readlink -f "$CURRENT_LINK" || true)
            echo "🔵 Currently active Blue release: $PREV_RELEASE"
          elif [ -d "$CURRENT_LINK" ]; then
            echo "⚠️ Migrating legacy directory to Blue-Green release structure..."
            LEGACY_BACKUP="$RELEASES_DIR/legacy_$TIMESTAMP"
            mv "$CURRENT_LINK" "$LEGACY_BACKUP"
            ln -sfn "$LEGACY_BACKUP" "$CURRENT_LINK"
            PREV_RELEASE="$LEGACY_BACKUP"
            echo "🔵 Migrated Blue release: $PREV_RELEASE"
          else
            echo "ℹ️ No existing release found. Initial fresh deployment."
          fi

          # 3. Automatic Rollback Trap: Triggers if ANY failure occurs
          rollback_on_error() {
            local exit_code=$?
            if [ $exit_code -ne 0 ]; then
              echo "=========================================================="
              echo "❌ [DEPLOYMENT ERROR] Backend step failed with exit code $exit_code"
              echo "🛡️ TRIGGERING AUTOMATIC BLUE-GREEN ROLLBACK / FALLBACK..."
              echo "=========================================================="

              # Remove broken Green slot
              if [ -d "$NEW_RELEASE_DIR" ]; then
                echo "🧹 Removing failed Green directory: $NEW_RELEASE_DIR"
                rm -rf "$NEW_RELEASE_DIR"
              fi

              # Ensure symlink points to previous healthy release
              if [ -n "$PREV_RELEASE" ] && [ -d "$PREV_RELEASE" ]; then
                echo "🔄 Restoring live traffic symlink to Blue release: $PREV_RELEASE"
                ln -sfn "$PREV_RELEASE" "$APP_DIR/current_tmp"
                mv -Tf "$APP_DIR/current_tmp" "$CURRENT_LINK"

                echo "🔄 Ensuring PM2 service is serving Blue release..."
                cd "$CURRENT_LINK"
                pm2 reload foodsaver-api || pm2 restart foodsaver-api || pm2 start src/server.js --name "foodsaver-api" || true
                echo "✅ Fallback complete: Production API remains 100% ONLINE on previous version ($PREV_RELEASE)!"
              else
                echo "⚠️ No previous release available to roll back to."
              fi
              echo "=========================================================="
              exit $exit_code
            fi
          }
          trap 'rollback_on_error' ERR

          # Step 1: Clone source into isolated Green slot
          echo "🟢 [1/6] Staging Green release in isolated directory: $NEW_RELEASE_DIR..."
          git clone --depth 1 "$REPO_URL" "$NEW_RELEASE_DIR"
          cd "$NEW_RELEASE_DIR"
          if [ -n "$COMMIT_SHA" ]; then
            git fetch --depth 1 origin "$COMMIT_SHA" 2>/dev/null || true
            git checkout "$COMMIT_SHA" 2>/dev/null || true
          fi

          # Step 2: Configure environment variables in shared storage & link
          echo "⚙️ [2/6] Writing production environment variables..."
          {
            echo "PORT=$PORT"
            echo "NODE_ENV=$NODE_ENV"
            echo "API_PREFIX=$API_PREFIX"
            echo "PAYMENT_WEBHOOK_SECRET=$PAYMENT_WEBHOOK_SECRET"
            echo "CORS_ORIGIN=$CORS_ORIGIN"
            echo ""
            echo "DATABASE_URL=$DATABASE_URL"
            echo ""
            echo "JWT_SECRET=$JWT_SECRET"
            echo "JWT_EXPIRES_IN=$JWT_EXPIRES_IN"
            echo "JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET"
            echo "JWT_REFRESH_EXPIRES_IN=$JWT_REFRESH_EXPIRES_IN"
            echo ""
            echo "CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME"
            echo "CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY"
            echo "CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET"
            echo ""
            echo "JEV_API_KEY=$JEV_API_KEY"
            echo "JEV_API_URL=$JEV_API_URL"
            echo "JEV_MODEL=$JEV_MODEL"
            echo "GROQ_API_KEY=$GROQ_API_KEY"
            echo "GROQ_MODEL=$GROQ_MODEL"
            echo "GROQ_API_URL=$GROQ_API_URL"
            echo ""
            echo "SMTP_HOST=$SMTP_HOST"
            echo "SMTP_PORT=$SMTP_PORT"
            echo "SMTP_USER=$SMTP_USER"
            echo "SMTP_PASS=$SMTP_PASS"
            echo ""
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
          } > "$SHARED_DIR/.env"
          ln -sfn "$SHARED_DIR/.env" "$NEW_RELEASE_DIR/.env"

          # Step 3: Install dependencies in Green slot
          echo "📦 [3/6] Installing production dependencies in Green slot..."
          npm ci --omit=dev --prefer-offline --no-audit || npm install --omit=dev --no-audit

          # Step 4: Generate Prisma Client and safe schema push
          echo "⚡ [4/6] Generating Prisma Client..."
          npx prisma generate
          echo "🗄️ Performing safe schema sync..."
          npx prisma db push --skip-generate || true

          # Step 5: Atomic Cutover (Symlink Switch)
          echo "🔀 [5/6] Performing atomic cutover to Green release..."
          ln -sfn "$NEW_RELEASE_DIR" "$APP_DIR/current_tmp"
          mv -Tf "$APP_DIR/current_tmp" "$CURRENT_LINK"

          # Step 6: Zero-Downtime Reload & Health Check
          echo "🔄 [6/6] Reloading PM2 backend service (Zero-Downtime)..."
          cd "$CURRENT_LINK"
          if pm2 describe foodsaver-api > /dev/null 2>&1; then
            pm2 reload foodsaver-api --update-env
          else
            pm2 start src/server.js --name "foodsaver-api"
          fi
          pm2 save

          echo "⏳ Verifying backend API health status..."
          sleep 4
          HEALTHY=false
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:${PORT:-5000}/api/v1/health || curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:${PORT:-5000}/ || echo "000")
            echo "Backend health check attempt $attempt: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
              HEALTHY=true
              break
            fi
            sleep 3
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Backend API failed health check after switchover!"
            exit 1
          fi

          # Clean up older releases (retain current + 3 previous)
          echo "🧹 Housekeeping: Retaining 4 most recent releases..."
          cd "$RELEASES_DIR"
          ls -dt */ 2>/dev/null | tail -n +5 | xargs rm -rf 2>/dev/null || true

          echo "=========================================================="
          echo "🎉 [SUCCESS] Backend Blue-Green deployment completed with Zero Downtime!"
          echo "Active Version: $TIMESTAMP"
          echo "=========================================================="
          REMOTE_DEPLOY_EOF
